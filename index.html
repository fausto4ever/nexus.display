<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus.Display</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="startup-splash" class="startup-splash" aria-label="Nexus.Display iniciando">
    <div class="startup-logo-card">
      <div class="brand-wordmark brand-wordmark-splash" aria-label="Nexus.Display">
        <span class="brand-nexus">Nexus</span><span class="brand-dot">.</span><span class="brand-display">Display</span>
      </div>
    </div>
  </div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
