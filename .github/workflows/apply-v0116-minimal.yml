name: Apply Nexus.Display 0.1.16 minimal style

on:
  push:
    paths:
      - '.github/workflows/apply-v0116-minimal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/apply-v0116-minimal.py
      - name: Validate JavaScript
        run: node --check src/renderers/control-access.js
      - name: Validate diff
        run: git diff --check
      - name: Verify no runtime style or script injection
        run: |
          ! grep -R "createElement('style')" src
          ! grep -R 'createElement("style")' src
          ! grep -R "createElement('script')" src
          ! grep -R 'createElement("script")' src
          ! grep -n 'style=' src/renderers/control-access.js
      - name: Commit
        run: |
          git config user.name 'nexus-display-bot'
          git config user.email 'nexus-display-bot@users.noreply.github.com'
          git add styles.css src/version.js package.json
          git commit -m 'feat: Nexus.Display 0.1.16 minimal visual hierarchy'
          git push origin main
