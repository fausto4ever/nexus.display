<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexus.Display · Laboratorio automático</title>
<style>
:root{--navy:#0f172a;--blue:#1e3a8a;--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden}.shell{height:100dvh;display:flex;flex-direction:column}.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.brand h1{margin:0;font-size:1.05rem}.brand p{margin:3px 0 0;font-size:.67rem;opacity:.78}.event{justify-self:center;min-width:260px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);text-align:center;font-size:.72rem;font-weight:750}.metrics{justify-self:end;display:grid;grid-template-columns:repeat(3,minmax(70px,1fr));gap:6px}.metric{padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.2);text-align:center}.metric strong{display:block;font-size:.92rem}.metric span{display:block;margin-top:2px;font-size:.48rem;text-transform:uppercase;opacity:.72}.lanes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,.9fr) minmax(220px,.9fr) minmax(300px,1.25fr);grid-template-areas:"waiting ready now";gap:10px;padding:10px}.lane{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 2px 4px rgba(15,23,42,.06);transition:border-color .2s,box-shadow .2s}.lane[data-lane="WAITING"]{grid-area:waiting}.lane[data-lane="READY"]{grid-area:ready}.lane[data-lane="NOW"]{grid-area:now}.lane-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}.lane-head h2{margin:0;font-size:.95rem}.lane-head h2::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#3b82f6}.lane[data-lane="READY"] .lane-head h2::before{background:#f59e0b}.lane[data-lane="NOW"] .lane-head h2::before{background:#ef4444}.count{padding:2px 8px;border-radius:999px;background:#f1f5f9;font-size:.8rem;font-weight:800}.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:auto}.empty{margin:auto;color:#94a3b8;font-size:.72rem}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04);will-change:transform}.card h3{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}.meta{margin-top:2px;color:var(--muted);font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:#f8fafc;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums}.card.enter{animation:cardEnter .55s cubic-bezier(.2,.8,.2,1)}.card.flash-now{animation:flashNow 1.2s ease-out}.card.flash-ready{animation:flashReady 1.2s ease-out}.card.flash-waiting{animation:flashWaiting 1.2s ease-out}.card.reordered{animation:reorderHalo .9s ease-out}.lane.pulse-now{animation:laneNowPulse 1.05s ease-out}.lane.pulse-ready{animation:laneReadyPulse 1.05s ease-out}.lane.pulse-waiting{animation:laneWaitingPulse 1.05s ease-out}.ghost{position:fixed;z-index:9999;pointer-events:none;margin:0;animation:disintegrate .68s ease-in-out forwards}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 12px;background:#fff;border-top:1px solid #e2e8f0;color:var(--muted);font-size:.66rem}.controls{display:flex;align-items:center;gap:7px}.controls button,.controls select{min-height:30px;border:1px solid var(--border);border-radius:7px;background:#f8fafc;font:inherit;font-weight:700}.controls button{padding:5px 10px;cursor:pointer}.status-dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#22c55e}.legend strong{color:#334155}
@keyframes cardEnter{0%{opacity:0;transform:translateY(10px) scale(.96)}65%{opacity:1;transform:translateY(-2px) scale(1.015)}100%{opacity:1;transform:none}}
@keyframes reorderHalo{0%{border-color:#60a5fa;box-shadow:0 0 0 0 rgba(37,99,235,.28)}45%{border-color:#2563eb;box-shadow:0 0 0 5px rgba(37,99,235,.12)}100%{border-color:var(--border);box-shadow:0 1px 2px rgba(15,23,42,.04)}}
@keyframes flashNow{0%{background:#ecfdf5;border-color:#10b981;box-shadow:0 0 18px rgba(16,185,129,.5)}100%{background:#fff}}
@keyframes flashReady{0%{background:#fffbeb;border-color:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.5)}100%{background:#fff}}
@keyframes flashWaiting{0%{background:#eff6ff;border-color:#3b82f6;box-shadow:0 0 18px rgba(59,130,246,.5)}100%{background:#fff}}
@keyframes laneNowPulse{0%{border-color:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.5)}42%{border-color:#dc2626;box-shadow:0 0 0 6px rgba(239,68,68,.13),0 8px 24px rgba(239,68,68,.18)}100%{border-color:var(--border);box-shadow:0 2px 4px rgba(15,23,42,.06)}}
@keyframes laneReadyPulse{0%{border-color:#f59e0b;box-shadow:0 0 0 0 rgba(245,158,11,.4)}45%{box-shadow:0 0 0 5px rgba(245,158,11,.1)}100%{border-color:var(--border)}}
@keyframes laneWaitingPulse{0%{border-color:#3b82f6;box-shadow:0 0 0 0 rgba(59,130,246,.4)}45%{box-shadow:0 0 0 5px rgba(59,130,246,.1)}100%{border-color:var(--border)}}
@keyframes disintegrate{0%{opacity:1;transform:scale(1);filter:blur(0)}45%{opacity:.65;transform:scale(1.04) translateY(-5px);filter:blur(1.5px) contrast(1.35);background:#fee2e2;border-color:#ef4444}100%{opacity:0;transform:scale(.56) translateY(20px) rotate(4deg);filter:blur(7px) grayscale(1)}}
@media(max-width:850px){.topbar{grid-template-columns:1fr auto;grid-template-areas:"brand metrics" "event event"}.brand{grid-area:brand}.metrics{grid-area:metrics}.event{grid-area:event;justify-self:stretch;min-width:0}.lanes{grid-template-columns:1fr;grid-template-areas:"now" "ready" "waiting";gap:7px;padding:7px}.lane-head{padding:7px 10px}.list{min-height:64px}.footer{font-size:.58rem}.legend{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><h1>Nexus.Display · Laboratorio automático</h1><p>La simulación inicia sola; no necesitas seleccionar tarjetas.</p></div>
    <div class="event" id="event">Preparando cola inicial…</div>
    <div class="metrics">
      <div class="metric"><strong id="m-list">0</strong><span>En lista</span></div>
      <div class="metric"><strong id="m-delivered">0</strong><span>Entregados</span></div>
      <div class="metric"><strong id="m-average">—</strong><span>Promedio</span></div>
    </div>
  </header>
  <main class="lanes" id="lanes"></main>
  <footer class="footer">
    <div class="legend"><span class="status-dot"></span><strong>Auto:</strong> WAITING → PREPÁRATE → AHORA → salida; también llegan directos a AHORA y se intercambian posiciones.</div>
    <div class="controls"><button id="toggle">Pausar</button><button id="reset">Reiniciar</button><select id="speed"><option value="2400">Lento</option><option value="1600" selected>Normal</option><option value="900">Rápido</option></select></div>
  </footer>
</div>
<script>
const names=['Santiago López García','Leonardo Pérez Aguilar','Emiliano Díaz Reyes','Sofía Martínez Luna','Natalia Rojas Castillo','Sebastián Ortiz Vega','Adrián Guzmán Paredes','Camila Torres Mendoza','Valentina Moreno Ruiz','Mateo Hernández Soto','Renata Flores Silva','Diego Ramírez León'];
const grades=[['1°','A'],['2°','B'],['3°','A'],['4°','A'],['5°','B'],['6°','A']];
const laneOrder=['WAITING','READY','NOW'];
const laneTitles={WAITING:'EN AULA / ESPERA',READY:'PREPÁRATE',NOW:'EN PUERTA (AHORA)'};
let seq=1,requests=[],completed=[],timer=null,running=true,speed=1600,lastEvent='';
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>String(n).padStart(2,'0');
function formatDuration(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${fmt(h)}:${fmt(m)}:${fmt(s)}`:`${fmt(m)}:${fmt(s)}`}
function elapsed(start){const t=Date.parse(start||'');return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/1000)):0}
function distanceLabel(m){if(!Number.isFinite(m))return'';return m>=1000?`${(m/1000).toFixed(1)} km`:`${Math.round(m)} m`}
function travelLabel(v){return v==='CAR'?'🚗 En auto':v==='WALK'?'🚶 A pie':''}
function metaFor(r){const parts=[r.level,`${r.grade} ${r.group}`];const t=travelLabel(r.arrivalMode);if(t)parts.push(t);if(r.status!=='NOW'&&Number.isFinite(r.distanceMeters))parts.push(distanceLabel(r.distanceMeters));return parts.filter(Boolean).join(' · ')}
function makeRequest(status='WAITING'){
 const [grade,group]=pick(grades),now=Date.now();
 return{requestId:`LAB-${String(seq++).padStart(3,'0')}`,studentName:pick(names),level:Math.random()>.25?'Primaria':'Secundaria',grade,group,arrivalMode:pick(['CAR','WALK','UNKNOWN']),distanceMeters:status==='NOW'?null:Math.round(40+Math.random()*1700),status,requestedAt:new Date(now-Math.random()*120000).toISOString(),arrivalTriggeredAt:status==='NOW'?new Date(now-Math.random()*25000).toISOString():null};
}
function cardHtml(r){const timerHtml=r.status==='NOW'?`<div class="timer" data-start="${r.arrivalTriggeredAt}">${formatDuration(elapsed(r.arrivalTriggeredAt))}</div>`:'';return `<article class="card" data-id="${r.requestId}" data-lane="${r.status}"><div><h3>${r.studentName}</h3><div class="meta">${metaFor(r)}</div></div>${timerHtml}</article>`}
function snapshot(){const map=new Map();document.querySelectorAll('.card[data-id]').forEach(el=>map.set(el.dataset.id,{rect:el.getBoundingClientRect(),lane:el.dataset.lane,html:el.outerHTML}));return map}
function ghostRemoved(before){const live=new Set(requests.map(r=>r.requestId));before.forEach((snap,id)=>{if(live.has(id))return;const ghost=document.createElement('article');ghost.className='card ghost';ghost.innerHTML=snap.html.replace(/^<article[^>]*>|<\/article>$/g,'');Object.assign(ghost.style,{left:snap.rect.left+'px',top:snap.rect.top+'px',width:snap.rect.width+'px',height:snap.rect.height+'px'});document.body.appendChild(ghost);setTimeout(()=>ghost.remove(),750)})}
function pulseLane(lane){const el=document.querySelector(`.lane[data-lane="${lane}"]`);if(!el)return;const cls='pulse-'+lane.toLowerCase();el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1150)}
function render(reason,lastChangedId=null){
 const before=snapshot(),oldLanes=new Map([...before].map(([id,v])=>[id,v.lane]));ghostRemoved(before);
 $('#lanes').innerHTML=laneOrder.map(lane=>{const items=requests.filter(r=>r.status===lane);return `<section class="lane" data-lane="${lane}"><div class="lane-head"><h2>${laneTitles[lane]}</h2><span class="count">${items.length}</span></div><div class="list">${items.map(cardHtml).join('')||'<div class="empty">Sin alumnos</div>'}</div></section>`}).join('');
 requestAnimationFrame(()=>{
  document.querySelectorAll('.card[data-id]').forEach(card=>{
   const id=card.dataset.id,snap=before.get(id),newLane=card.dataset.lane;
   if(!snap){card.classList.add('enter');if(newLane==='NOW')pulseLane('NOW');return}
   const rect=card.getBoundingClientRect(),dx=snap.rect.left-rect.left,dy=snap.rect.top-rect.top,changed=snap.lane!==newLane,moved=Math.abs(dx)>1||Math.abs(dy)>1;
   if(moved){card.animate([{transform:`translate(${dx}px,${dy}px) scale(.965)`,boxShadow:'0 14px 34px rgba(15,23,42,.24)'},{offset:.75,transform:'translate(0,0) scale(1.02)',boxShadow:'0 8px 18px rgba(15,23,42,.14)'},{transform:'translate(0,0) scale(1)',boxShadow:'0 1px 2px rgba(15,23,42,.04)'}],{duration:850,easing:'cubic-bezier(.16,.8,.2,1)'});if(!changed){card.classList.add('reordered');setTimeout(()=>card.classList.remove('reordered'),950)}}
   if(changed){card.classList.add('flash-'+newLane.toLowerCase());pulseLane(newLane);setTimeout(()=>card.classList.remove('flash-'+newLane.toLowerCase()),1300)}
  });
 });
 lastEvent=reason;$('#event').textContent=reason;updateMetrics();tickTimers();
}
function updateMetrics(){ $('#m-list').textContent=requests.length;$('#m-delivered').textContent=completed.length;const avg=completed.length?completed.reduce((a,b)=>a+b,0)/completed.length:null;$('#m-average').textContent=avg==null?'—':formatDuration(avg)}
function tickTimers(){document.querySelectorAll('.timer[data-start]').forEach(el=>el.textContent=formatDuration(elapsed(el.dataset.start)))}
function seed(){seq=1;completed=[];requests=[];for(let i=0;i<7;i++)requests.push(makeRequest('WAITING'));render('Inicio: 7 solicitudes en ESPERA')}
function moveOne(from,to){const candidates=requests.filter(r=>r.status===from);if(!candidates.length)return false;const r=pick(candidates);r.status=to;if(to==='READY')r.distanceMeters=Math.max(20,Math.round((r.distanceMeters||500)*.35));if(to==='NOW'){r.distanceMeters=null;r.arrivalTriggeredAt=new Date().toISOString()}render(`${r.studentName}: ${laneTitles[from]} → ${laneTitles[to]}`,r.requestId);return true}
function directNow(){const r=makeRequest('NOW');requests.push(r);render(`Llegada directa a AHORA: ${r.studentName}`,r.requestId)}
function addWaiting(){const r=makeRequest('WAITING');requests.push(r);render(`Nueva solicitud en ESPERA: ${r.studentName}`,r.requestId)}
function reorderLane(){const lanes=laneOrder.filter(l=>requests.filter(r=>r.status===l).length>=2);if(!lanes.length)return false;const lane=pick(lanes),idx=requests.map((r,i)=>r.status===lane?i:-1).filter(i=>i>=0);const a=pick(idx);let b=pick(idx);while(b===a)b=pick(idx);[requests[a],requests[b]]=[requests[b],requests[a]];render(`Intercambio de posiciones en ${laneTitles[lane]}`);return true}
function completeNow(){const candidates=requests.filter(r=>r.status==='NOW');if(!candidates.length)return false;const r=pick(candidates),duration=elapsed(r.arrivalTriggeredAt);completed.push(duration);requests=requests.filter(x=>x.requestId!==r.requestId);render(`Salida real: ${r.studentName} · ${formatDuration(duration)}`);return true}
function randomStep(){
 const options=[];
 if(requests.some(r=>r.status==='WAITING'))options.push(()=>moveOne('WAITING','READY'),()=>moveOne('WAITING','READY'));
 if(requests.some(r=>r.status==='READY'))options.push(()=>moveOne('READY','NOW'),()=>moveOne('READY','NOW'));
 if(requests.some(r=>r.status==='NOW'))options.push(completeNow);
 if(requests.some(r=>r.status==='WAITING')||requests.some(r=>r.status==='READY')||requests.some(r=>r.status==='NOW'))options.push(reorderLane,reorderLane);
 options.push(addWaiting,directNow);
 let fn=pick(options),ok=fn();if(ok===false){fn=addWaiting;fn()}
}
function schedule(){clearTimeout(timer);if(!running)return;timer=setTimeout(()=>{randomStep();schedule()},speed)}
$('#toggle').onclick=()=>{running=!running;$('#toggle').textContent=running?'Pausar':'Continuar';if(running)schedule();else clearTimeout(timer)};
$('#reset').onclick=()=>{seed();schedule()};
$('#speed').onchange=e=>{speed=Number(e.target.value)||1600;schedule()};
setInterval(()=>{tickTimers();updateMetrics()},250);
seed();schedule();
</script>
</body>
</html>
