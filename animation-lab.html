<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus.Display Lab 0.1.40</title><style>:root{font-family:system-ui;--b:#cbd5e1}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a}.top{padding:12px 16px;background:#0f172a;color:white}.top h1{margin:0;font-size:18px}.top p{margin:4px 0 0;font-size:12px}.event{margin:8px 10px 0;padding:9px 12px;background:white;border:1px solid var(--b);border-radius:10px;font-weight:700}.event.arrival{background:#f0fdf4;border-color:#86efac}.event.reminder{background:#fef2f2;border-color:#fca5a5}.lanes{height:calc(100vh - 150px);display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;padding:10px}.lane{background:white;border:1px solid var(--b);border-radius:12px;overflow:hidden}.head{padding:9px 11px;border-bottom:1px solid var(--b);font-weight:800}.list{padding:8px;display:flex;flex-direction:column;gap:6px}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;min-height:54px;padding:9px 11px;border:1px solid #dbe3ee;border-radius:10px;background:white}.card h3{margin:0;font-size:15px}.meta{margin-top:4px;color:#64748b;font-size:11px}.timer,.distance{min-width:64px;padding:5px 8px;border:1px solid #dbe3ee;border-radius:6px;background:#f8fafc;font-size:12px;font-weight:850;text-align:center}.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1)}.flash-now{animation:flashNow 1.2s}.flash-ready{animation:flashReady 1.2s}.flash-waiting{animation:flashWaiting 1.2s}.remind{animation:remind 2s}.pulse{animation:pulse 1.1s}.ghost{position:fixed;z-index:9;animation:gone 1.18s forwards}.controls{display:flex;gap:8px;align-items:center;padding:7px 12px;background:white;border-top:1px solid #e2e8f0;font-size:12px}.controls button,.controls select{padding:5px 9px}@keyframes enter{0%{opacity:0;transform:translateY(10px) scale(.96)}65%{transform:translateY(-2px) scale(1.015)}100%{opacity:1;transform:none}}@keyframes flashNow{0%{background:#ecfdf5;border-color:#10b981;box-shadow:0 0 18px #10b98180}100%{background:white}}@keyframes flashReady{0%{background:#fffbeb;border-color:#f59e0b}100%{background:white}}@keyframes flashWaiting{0%{background:#eff6ff;border-color:#3b82f6}100%{background:white}}@keyframes remind{30%{transform:scale(1.025);box-shadow:0 0 0 6px #f871712e}75%{transform:scale(1.018);box-shadow:0 0 0 4px #f871711f}}@keyframes pulse{45%{border-color:#dc2626;box-shadow:0 0 0 6px #ef444421}}@keyframes gone{18%{transform:scale(1.1) translateY(-5px)}62%{opacity:.7;transform:scale(.95) translateX(7px);filter:blur(1px)}100%{opacity:0;transform:scale(.32) translateY(38px) rotate(8deg);filter:blur(10px)}}@media(max-width:800px){.lanes{grid-template-columns:1fr;height:auto}.controls{flex-wrap:wrap}}</style></head><body><header class="top"><h1>Nexus.Display · Laboratorio 0.1.40</h1><p>Transiciones productivas + rampa blanco → naranja → rojo configurable.</p></header><div id="event" class="event">AHORA · simulación lista</div><main id="lanes" class="lanes"></main><footer class="controls"><b>Rampa:</b><select id="ramp"><option value="5">5 min</option><option value="3">3 min</option><option value="1">1 min</option></select><button id="add">Nueva solicitud</button><button id="step">Avanzar estado</button><button id="reset">Reiniciar</button><span>Recordatorio visual cada minuto en AHORA.</span></footer><script>const names=['Santiago López García','Sofía Martínez Luna','Camila Torres Mendoza','Mateo Hernández Soto'];const lanes=['WAITING','READY','NOW'];let seq=1,done=0,ramp=5,rows=[],mins=new Map();const $=s=>document.querySelector(s),pick=a=>a[Math.floor(Math.random()*a.length)],elapsed=t=>Math.max(0,(Date.now()-Date.parse(t))/1000),fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function make(status='WAITING'){let now=Date.now();return{id:'LAB-'+seq++,name:pick(names),level:pick(['Primaria','Secundaria']),grade:pick(['1° A','2° B','3° A']),mode:pick(['🚗 En auto','🚶 A pie']),distance:Math.round(60+Math.random()*900),status,arrival:status==='NOW'?new Date(now).toISOString():null}}function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}function paint(r){if(r.status!=='NOW')return'';let p=smooth(elapsed(r.arrival)/(ramp*60));if(p<=.5){let t=p*2;return`background:rgb(255,${Math.round(255-90*t)},${Math.round(255-238*t)});border-color:rgb(${Math.round(219+34*t)},${Math.round(227-41*t)},${Math.round(238-122*t)})`}let t=(p-.5)*2;return`background:rgb(${Math.round(255-102*t)},${Math.round(165-138*t)},${Math.round(17+10*t)});border-color:rgb(${Math.round(253-126*t)},${Math.round(186-157*t)},${Math.round(116-87*t)});color:${t>.55?'white':'#0f172a'}`}function html(r){let right=r.status==='NOW'?`<div class="timer">${fmt(elapsed(r.arrival))}</div>`:`<div class="distance">${r.distance} m</div>`;return`<article class="card" data-id="${r.id}" data-lane="${r.status}" style="${paint(r)}"><div><h3>${r.name}</h3><div class="meta">${r.level} · ${r.grade} · ${r.mode}</div></div>${right}</article>`}function snapshot(){let m=new Map;document.querySelectorAll('.card').forEach(e=>m.set(e.dataset.id,{rect:e.getBoundingClientRect(),lane:e.dataset.lane,html:e.outerHTML}));return m}function event(kind,text){let e=$('#event');e.className='event '+kind;e.textContent=(kind==='arrival'?'NUEVA LLEGADA · ':kind==='reminder'?'RECORDATORIO · ':'AHORA · ')+text}function render(){let before=snapshot(),live=new Set(rows.map(r=>r.id));before.forEach((s,id)=>{if(live.has(id))return;let g=document.createElement('div');g.className='card ghost';g.innerHTML=s.html.replace(/^<article[^>]*>|<\/article>$/g,'');Object.assign(g.style,{left:s.rect.left+'px',top:s.rect.top+'px',width:s.rect.width+'px'});document.body.appendChild(g);setTimeout(()=>g.remove(),1250)});$('#lanes').innerHTML=lanes.map(l=>`<section class="lane" data-lane="${l}"><div class="head">${l==='WAITING'?'EN AULA / ESPERA':l==='READY'?'PREPÁRATE':'EN PUERTA (AHORA)'}</div><div class="list">${rows.filter(r=>r.status===l).map(html).join('')||'Sin alumnos'}</div></section>`).join('');requestAnimationFrame(()=>document.querySelectorAll('.card').forEach(c=>{let s=before.get(c.dataset.id);if(!s){c.classList.add('enter');return}let q=c.getBoundingClientRect(),dx=s.rect.left-q.left,dy=s.rect.top-q.top;if(Math.abs(dx)>1||Math.abs(dy)>1)c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});if(s.lane!==c.dataset.lane){c.classList.add('flash-'+c.dataset.lane.toLowerCase());let lane=c.closest('.lane');lane.classList.add('pulse')}}))}function advance(){let r=rows.find(x=>x.status==='WAITING')||rows.find(x=>x.status==='READY')||rows.find(x=>x.status==='NOW');if(!r){rows.push(make());return render()}if(r.status==='WAITING')r.status='READY';else if(r.status==='READY'){r.status='NOW';r.arrival=new Date().toISOString();mins.set(r.id,0);event('arrival',r.name+' · trasladar a punto de entrega')}else{rows=rows.filter(x=>x!==r);mins.delete(r.id);done++}render()}function tick(){document.querySelectorAll('.card[data-lane="NOW"]').forEach(c=>{let r=rows.find(x=>x.id===c.dataset.id);if(!r)return;c.style.cssText=paint(r);c.querySelector('.timer').textContent=fmt(elapsed(r.arrival));let m=Math.floor(elapsed(r.arrival)/60),old=mins.get(r.id)||0;if(m>=1&&m>old){mins.set(r.id,m);c.classList.remove('remind');void c.offsetWidth;c.classList.add('remind');c.closest('.lane').classList.add('pulse');event('reminder',r.name+' te espera para entrega')}})}$('#add').onclick=()=>{rows.push(make());render()};$('#step').onclick=advance;$('#reset').onclick=()=>{rows=[make(),make('READY'),make('NOW')];mins.clear();rows.filter(r=>r.status==='NOW').forEach(r=>mins.set(r.id,0));event('','simulación reiniciada');render()};$('#ramp').onchange=e=>ramp=Number(e.target.value);rows=[make(),make(),make('READY'),make('NOW')];rows.filter(r=>r.status==='NOW').forEach(r=>mins.set(r.id,0));render();setInterval(tick,250);</script></body></html>
