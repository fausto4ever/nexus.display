<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexus.Display Animation Lab</title>
<style>
:root{--navy:#0f172a;--blue:#1e3a8a;--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{padding:14px}.lab-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;min-height:calc(100vh - 28px)}.display{min-width:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 35px rgba(15,23,42,.12)}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.brand h1{margin:0;font-size:1.2rem}.brand p{margin:3px 0 0;font-size:.72rem;opacity:.8}.clock{text-align:center}.clock strong{display:block;font-size:2rem}.clock span{font-size:.7rem;opacity:.75}.metrics{justify-self:end;display:grid;grid-template-columns:repeat(3,minmax(76px,1fr));gap:7px}.metric{padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.2);text-align:center}.metric strong{display:block;font-size:1rem}.metric span{font-size:.52rem;text-transform:uppercase;opacity:.72}.lanes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,.9fr) minmax(220px,.9fr) minmax(300px,1.25fr);grid-template-areas:"waiting ready now";gap:10px;padding:10px}.lane{min-width:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}.lane[data-lane="WAITING"]{grid-area:waiting}.lane[data-lane="READY"]{grid-area:ready}.lane[data-lane="NOW"]{grid-area:now}.lane-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}.lane-head h2{margin:0;font-size:1rem}.lane-head h2::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#3b82f6}.lane[data-lane="READY"] .lane-head h2::before{background:#f59e0b}.lane[data-lane="NOW"] .lane-head h2::before{background:#ef4444}.count{padding:2px 8px;border-radius:999px;background:#f1f5f9;font-weight:800}.list{flex:1;min-height:150px;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:auto}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04);cursor:pointer;transition:border-color .2s,background-color .2s,box-shadow .2s}.card.selected{outline:3px solid rgba(37,99,235,.22);border-color:#2563eb}.card h3{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}.meta{margin-top:2px;color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:#f8fafc;font-weight:800;font-variant-numeric:tabular-nums}.card.flash-now{animation:flashNow 1.2s ease-out}.card.flash-ready{animation:flashReady 1.2s ease-out}.card.flash-waiting{animation:flashWaiting 1.2s ease-out}.card.enter{animation:cardEnter .55s cubic-bezier(.2,.8,.2,1)}.ghost{position:fixed;z-index:9999;pointer-events:none;margin:0;animation:disintegrate .65s ease-in-out forwards}.controls{align-self:start;position:sticky;top:14px;padding:14px;border-radius:16px;background:#fff;box-shadow:0 10px 35px rgba(15,23,42,.1)}.controls h2{margin:0 0 4px;font-size:1rem}.controls p{margin:0 0 12px;color:var(--muted);font-size:.75rem;line-height:1.35}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons button{min-height:38px;border:1px solid var(--border);border-radius:9px;background:#f8fafc;font-weight:700;cursor:pointer}.buttons button.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.buttons button.danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}.buttons button.wide{grid-column:1/-1}.log{margin-top:12px;padding:9px;border-radius:9px;background:#0f172a;color:#cbd5e1;font:11px/1.35 ui-monospace,SFMono-Regular,monospace;min-height:96px;max-height:180px;overflow:auto}.hint{margin-top:10px;font-size:.68rem;color:var(--muted)}
@keyframes cardEnter{0%{opacity:0;transform:translateY(10px) scale(.97)}65%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes flashNow{0%{background:#ecfdf5;border-color:#10b981;box-shadow:0 0 18px rgba(16,185,129,.5)}100%{background:#fff}}
@keyframes flashReady{0%{background:#fffbeb;border-color:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.5)}100%{background:#fff}}
@keyframes flashWaiting{0%{background:#eff6ff;border-color:#3b82f6;box-shadow:0 0 18px rgba(59,130,246,.5)}100%{background:#fff}}
@keyframes disintegrate{0%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}45%{opacity:.65;transform:scale(1.04) translateY(-5px);filter:blur(1.5px) contrast(1.35);background:#fee2e2;border-color:#ef4444}100%{opacity:0;transform:scale(.58) translateY(18px) rotate(4deg);filter:blur(7px) grayscale(1)}}
@media(max-width:900px){body{padding:0}.lab-shell{grid-template-columns:1fr;gap:0}.controls{position:relative;top:0;border-radius:0;order:-1}.display{border-radius:0}.lanes{grid-template-columns:1fr;grid-template-areas:"now" "ready" "waiting"}.topbar{grid-template-columns:1fr auto;grid-template-areas:"brand clock" "metrics metrics"}.brand{grid-area:brand}.clock{grid-area:clock;text-align:right}.metrics{grid-area:metrics;justify-self:stretch}.list{min-height:90px}}
</style>
</head>
<body>
<div class="lab-shell">
  <section class="display">
    <header class="topbar">
      <div class="brand"><h1>Nexus.Display · Laboratorio</h1><p>Simulación local de entrega escolar</p></div>
      <div class="clock"><strong id="clock">--:--</strong><span id="date">--</span></div>
      <div class="metrics">
        <div class="metric"><strong id="metric-list">0</strong><span>En lista</span></div>
        <div class="metric"><strong id="metric-delivered">0</strong><span>Entregados</span></div>
        <div class="metric"><strong id="metric-average">—</strong><span>Promedio</span></div>
      </div>
    </header>
    <main class="lanes" id="lanes"></main>
  </section>

  <aside class="controls">
    <h2>Controles de prueba</h2>
    <p>Selecciona una tarjeta y usa los botones para probar movimientos, cambios de estado, promedio y destrucción.</p>
    <div class="buttons">
      <button id="add-waiting" class="primary">+ Espera</button>
      <button id="add-ready">+ Prepárate</button>
      <button id="add-now">+ Ahora</button>
      <button id="add-five">Crear 5</button>
      <button id="advance">→ Avanzar</button>
      <button id="back">← Retroceder</button>
      <button id="up">↑ Subir</button>
      <button id="down">↓ Bajar</button>
      <button id="deliver" class="primary">✓ Entregado</button>
      <button id="cancel" class="danger">Cancelar</button>
      <button id="toggle-levels" class="wide">Alternar 1 / 2 niveles</button>
      <button id="auto" class="wide">▶ Ciclo automático</button>
      <button id="reset" class="wide">Reiniciar laboratorio</button>
    </div>
    <div class="log" id="log"></div>
    <div class="hint">Entregado sí alimenta el promedio. Cancelado no lo modifica.</div>
  </aside>
</div>
<script>
const names=['Santiago López García','Leonardo Pérez Aguilar','Emiliano Díaz Reyes','Sofía Martínez Luna','Natalia Rojas Castillo','Sebastián Ortiz Vega','Adrián Guzmán Paredes','Camila Torres Mendoza'];
const grades=['1° A','2° B','3° A','4° A','5° B','6° A'];
let seq=1,selectedId=null,autoTimer=null,twoLevels=true;
let requests=[],completedDurations=[];
const laneOrder=['WAITING','READY','NOW'];
const laneInfo={WAITING:['EN AULA / ESPERA','Solicitud recibida'],READY:['PREPÁRATE','Ya está cerca'],NOW:['EN PUERTA (AHORA)','Listo para salir']};
const $=s=>document.querySelector(s);
const fmt=n=>String(n).padStart(2,'0');
function formatDuration(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${fmt(h)}:${fmt(m)}:${fmt(s)}`:`${fmt(m)}:${fmt(s)}`}
function elapsed(start){const t=Date.parse(start||'');return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/1000)):0}
function distanceLabel(m){if(!Number.isFinite(m))return'';return m>=1000?`${(m/1000).toFixed(1)} km`:`${Math.round(m)} m`}
function travelLabel(v){return v==='CAR'?'🚗 En auto':v==='WALK'?'🚶 A pie':''}
function showLevel(){return twoLevels}
function metaFor(r){const parts=[];if(showLevel())parts.push(r.level);parts.push(r.grade);const t=travelLabel(r.arrivalMode);if(t)parts.push(t);if((r.status==='WAITING'||r.status==='READY')&&Number.isFinite(r.distanceMeters))parts.push(distanceLabel(r.distanceMeters));return parts.filter(Boolean).join(' · ')}
function key(r){return r.requestId}
function randomItem(a){return a[Math.floor(Math.random()*a.length)]}
function makeRequest(status='WAITING'){
 const mode=randomItem(['CAR','WALK','UNKNOWN']);
 const now=Date.now();
 return{requestId:`LAB-${String(seq++).padStart(3,'0')}`,studentName:randomItem(names),level:Math.random()>.28?'Primaria':'Secundaria',grade:randomItem(grades),arrivalMode:mode,distanceMeters:status==='NOW'?null:Math.round(30+Math.random()*1800),status,requestedAt:new Date(now-60000*Math.floor(Math.random()*4)).toISOString(),arrivalTriggeredAt:status==='NOW'?new Date(now-1000*Math.floor(5+Math.random()*85)).toISOString():null};
}
function snapshot(){const m=new Map();document.querySelectorAll('.card[data-id]').forEach(el=>m.set(el.dataset.id,{rect:el.getBoundingClientRect(),lane:el.dataset.lane,html:el.outerHTML}));return m}
function render(reason='actualización'){
 const before=snapshot();
 const oldLane=new Map([...before].map(([id,v])=>[id,v.lane]));
 const liveIds=new Set(requests.map(key));
 before.forEach((snap,id)=>{if(liveIds.has(id))return;const ghost=document.createElement('div');ghost.className='card ghost';ghost.innerHTML=snap.html.replace(/^<article[^>]*>|<\/article>$/g,'');Object.assign(ghost.style,{left:snap.rect.left+'px',top:snap.rect.top+'px',width:snap.rect.width+'px',height:snap.rect.height+'px'});document.body.appendChild(ghost);setTimeout(()=>ghost.remove(),700)});
 $('#lanes').innerHTML=laneOrder.map(lane=>{const items=requests.filter(r=>r.status===lane);return `<section class="lane" data-lane="${lane}"><div class="lane-head"><h2>${laneInfo[lane][0]}</h2><span class="count">${items.length}</span></div><div class="list">${items.map(r=>cardHtml(r)).join('')||'<div style="margin:auto;color:#94a3b8;font-size:.75rem">Sin alumnos</div>'}</div></section>`}).join('');
 requestAnimationFrame(()=>document.querySelectorAll('.card[data-id]').forEach(card=>{const id=card.dataset.id,snap=before.get(id);if(!snap){card.classList.add('enter');return}const rect=card.getBoundingClientRect(),dx=snap.rect.left-rect.left,dy=snap.rect.top-rect.top;if(Math.abs(dx)>1||Math.abs(dy)>1)card.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:480,easing:'cubic-bezier(.2,.8,.2,1)'});if(oldLane.get(id)!==card.dataset.lane){const cls='flash-'+card.dataset.lane.toLowerCase();card.classList.add(cls);setTimeout(()=>card.classList.remove(cls),1300)}}));
 updateMetrics();tickTimers();log(reason);
}
function cardHtml(r){const timer=r.status==='NOW'?`<div class="timer" data-start="${r.arrivalTriggeredAt||new Date().toISOString()}">${formatDuration(elapsed(r.arrivalTriggeredAt))}</div>`:'';return `<article class="card${r.requestId===selectedId?' selected':''}" data-id="${r.requestId}" data-lane="${r.status}"><div><h3>${r.studentName}</h3><div class="meta">${metaFor(r)}</div></div>${timer}</article>`}
function tickTimers(){document.querySelectorAll('.timer[data-start]').forEach(el=>el.textContent=formatDuration(elapsed(el.dataset.start)))}
function updateMetrics(){ $('#metric-list').textContent=requests.length;$('#metric-delivered').textContent=completedDurations.length;const avg=completedDurations.length?completedDurations.reduce((a,b)=>a+b,0)/completedDurations.length:null;$('#metric-average').textContent=avg==null?'—':formatDuration(avg)}
function log(msg){const t=new Date().toLocaleTimeString('es-MX');$('#log').innerHTML=`<div>${t} · ${msg}</div>`+$('#log').innerHTML}
function selected(){return requests.find(r=>r.requestId===selectedId)}
function ensureSelected(){if(selected())return selected();if(requests[0]){selectedId=requests[0].requestId;return requests[0]}return null}
function add(status){const r=makeRequest(status);requests.push(r);selectedId=r.requestId;render(`Creada ${r.requestId} en ${status}`)}
function move(delta){const r=ensureSelected();if(!r)return;let i=laneOrder.indexOf(r.status);i=Math.max(0,Math.min(laneOrder.length-1,i+delta));const next=laneOrder[i];if(next===r.status)return;r.status=next;if(next==='NOW')r.arrivalTriggeredAt=new Date().toISOString();if(next!=='NOW')r.arrivalTriggeredAt=null;render(`${r.requestId}: ${next}`)}
function reorder(dir){const r=ensureSelected();if(!r)return;const laneItems=requests.filter(x=>x.status===r.status),idx=laneItems.findIndex(x=>x.requestId===r.requestId),other=laneItems[idx+dir];if(!other)return;const a=requests.indexOf(r),b=requests.indexOf(other);[requests[a],requests[b]]=[requests[b],requests[a]];render(`${r.requestId}: reordenado`)}
function finish(cancelled=false){const r=ensureSelected();if(!r)return;if(!cancelled&&r.status==='NOW'&&r.arrivalTriggeredAt)completedDurations.push(elapsed(r.arrivalTriggeredAt));requests=requests.filter(x=>x.requestId!==r.requestId);selectedId=requests[0]?.requestId||null;render(`${r.requestId}: ${cancelled?'CANCELADA':'ENTREGADA'}`)}
function seed(){requests=[makeRequest('WAITING'),makeRequest('WAITING'),makeRequest('READY'),makeRequest('NOW'),makeRequest('NOW')];requests[3].arrivalTriggeredAt=new Date(Date.now()-18000).toISOString();requests[4].arrivalTriggeredAt=new Date(Date.now()-74000).toISOString();selectedId=requests[3].requestId;completedDurations=[162,238,201];render('Laboratorio reiniciado')}
function autoStep(){if(requests.length<3||Math.random()<.25){add('WAITING');return}const r=randomItem(requests);selectedId=r.requestId;if(r.status==='WAITING')move(1);else if(r.status==='READY')move(1);else if(Math.random()<.72)finish(false);else reorder(Math.random()<.5?-1:1)}
document.addEventListener('click',e=>{const card=e.target.closest('.card[data-id]');if(card){selectedId=card.dataset.id;render(`Seleccionada ${selectedId}`)}});
$('#add-waiting').onclick=()=>add('WAITING');$('#add-ready').onclick=()=>add('READY');$('#add-now').onclick=()=>add('NOW');$('#add-five').onclick=()=>{for(let i=0;i<5;i++)requests.push(makeRequest(i<2?'WAITING':i<4?'READY':'NOW'));selectedId=requests.at(-1).requestId;render('Creadas 5 solicitudes')};$('#advance').onclick=()=>move(1);$('#back').onclick=()=>move(-1);$('#up').onclick=()=>reorder(-1);$('#down').onclick=()=>reorder(1);$('#deliver').onclick=()=>finish(false);$('#cancel').onclick=()=>finish(true);$('#toggle-levels').onclick=()=>{twoLevels=!twoLevels;render(twoLevels?'Mostrando nivel académico':'Ocultando nivel: una sola modalidad activa')};$('#reset').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;$('#auto').textContent='▶ Ciclo automático'}completedDurations=[];seed()};$('#auto').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;$('#auto').textContent='▶ Ciclo automático';log('Ciclo automático detenido')}else{autoTimer=setInterval(autoStep,1700);$('#auto').textContent='■ Detener ciclo';log('Ciclo automático iniciado')}};
setInterval(()=>{tickTimers();const d=new Date();$('#clock').textContent=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'})},1000);
seed();
</script>
</body>
</html>
